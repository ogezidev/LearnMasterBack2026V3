spring.application.name=tccv2

# Credenciais ficam fora do Git: variaveis de ambiente DB_URL, DB_USER e DB_PASSWORD
# ou o arquivo local.properties na raiz do projeto (veja local.properties.example).
spring.config.import=optional:file:./local.properties

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# Frontend (CORS e link do e-mail de recuperacao)
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Token de acesso: chave HMAC com pelo menos 32 caracteres
app.jwt.secret=${JWT_SECRET}

# Cookie do refresh token. Em http://localhost os navegadores aceitam Secure.
# Frontend e backend em dominios diferentes (producao): COOKIE_SAMESITE=None
app.cookie.secure=${COOKIE_SECURE:true}
app.cookie.same-site=${COOKIE_SAMESITE:Strict}

# SMTP (Gmail: smtp.gmail.com, porta 587, senha de app). Com MAIL_HOST vazio o link sai so no log.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:${MAIL_USER:}}
